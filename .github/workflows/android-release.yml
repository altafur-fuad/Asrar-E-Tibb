name: Android APK Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'feat/**'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Test build of Asrar-e-Tibb Android Application with modernized navigation and security fixes.'
      publish_release:
        description: 'Publish official GitHub Release (defaults to false for test artifact)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build Release APK Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inspect Flutter Environment
        run: flutter doctor -v

      - name: Install Flutter Dependencies
        run: |
          if [ -f "./pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "./Asrar-E-Tibb/pubspec.yaml" ]; then
            cd Asrar-E-Tibb && flutter pub get
          fi

      - name: Run Automated Flutter Verification Tests
        run: |
          if [ -f "./pubspec.yaml" ]; then
            flutter test
          elif [ -f "./Asrar-E-Tibb/pubspec.yaml" ]; then
            cd Asrar-E-Tibb && flutter test
          fi

      - name: Build Android APK
        run: |
          if [ -f "./pubspec.yaml" ]; then
            flutter build apk --release --android-skip-build-dependency-validation
          elif [ -f "./Asrar-E-Tibb/pubspec.yaml" ]; then
            cd Asrar-E-Tibb && flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Verify APK & Generate SHA-256 Checksum
        run: |
          if [ -f "./build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_SOURCE="./build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "./Asrar-E-Tibb/build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_SOURCE="./Asrar-E-Tibb/build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "ERROR: Expected APK not found!"
            exit 1
          fi

          mkdir -p ./release-assets
          cp "$APK_SOURCE" ./release-assets/Asrar-E-Tibb.apk

          cd ./release-assets
          sha256sum Asrar-E-Tibb.apk > Asrar-E-Tibb.apk.sha256
          echo "Generated SHA-256 Checksum:"
          cat Asrar-E-Tibb.apk.sha256
          ls -lh Asrar-E-Tibb.apk

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "notes=${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "publish=${{ github.event.inputs.publish_release }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "notes=Official automated release for ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "publish=true" >> $GITHUB_OUTPUT
          else
            echo "tag=feat-test" >> $GITHUB_OUTPUT
            echo "notes=Test build artifact from feature branch ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK and Checksum as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asrar-e-tibb-apk-${{ steps.tag_info.outputs.tag }}
          path: |
            ./release-assets/Asrar-E-Tibb.apk
            ./release-assets/Asrar-E-Tibb.apk.sha256
          retention-days: 14

      - name: Publish GitHub Release (Only if publish_release is true)
        if: steps.tag_info.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Asrar-e-Tibb Android ${{ steps.tag_info.outputs.tag }}
          body: |
            ### Asrar-e-Tibb Official Android Release (${{ steps.tag_info.outputs.tag }})

            ${{ steps.tag_info.outputs.notes }}

            #### Release Assets:
            - **`Asrar-E-Tibb.apk`**: Release Android APK
            - **`Asrar-E-Tibb.apk.sha256`**: Cryptographic verification checksum

            #### Verification:
            Verify your download integrity before installation:
            ```bash
            sha256sum -c Asrar-E-Tibb.apk.sha256
            ```
          files: |
            ./release-assets/Asrar-E-Tibb.apk
            ./release-assets/Asrar-E-Tibb.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
