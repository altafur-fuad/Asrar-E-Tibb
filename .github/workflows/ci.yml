name: Unified CI Pipeline

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  website-verification:
    name: Verify Next.js Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install Website Dependencies
        working-directory: ./website
        run: npm ci || npm install

      - name: Run Website Tests
        working-directory: ./website
        run: npm test

      - name: Build Next.js Production Bundle
        working-directory: ./website
        run: npm run build
        env:
          NEXT_PUBLIC_APP_VERSION: '1.0.0'
          NEXT_PUBLIC_API_BASE_URL: 'https://asrar-e-tibb-api.onrender.com'

  rust-backend-verification:
    name: Verify Rust Axum Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './backend/api -> target'

      - name: Cargo Check
        working-directory: ./backend/api
        run: cargo check --verbose

      - name: Cargo Test
        working-directory: ./backend/api
        run: cargo test --verbose

  flutter-app-verification:
    name: Verify Flutter Mobile Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies & Test
        run: |
          if [ -f "./pubspec.yaml" ]; then
            flutter pub get
            flutter test
          elif [ -f "./Asrar-E-Tibb/pubspec.yaml" ]; then
            cd Asrar-E-Tibb
            flutter pub get
            flutter test
          fi
